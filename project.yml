name: DinoRealmsIOS
options:
  bundleIdPrefix: com.tomwu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  DinoRealmsIOS:
    type: application
    platform: iOS
    sources:
      - path: DinoRealmsIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomwu.DinoRealmsIOS
        PRODUCT_NAME: DinoRealmsIOS
        INFOPLIST_FILE: DinoRealmsIOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
  DinoRealmsIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DinoRealmsIOSTests
    dependencies:
      - target: DinoRealmsIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomwu.DinoRealmsIOSTests
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  DinoRealmsIOS:
    build:
      targets:
        DinoRealmsIOS: all
        DinoRealmsIOSTests: [test]
    test:
      targets:
        - DinoRealmsIOSTests
